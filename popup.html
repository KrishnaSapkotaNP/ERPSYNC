<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 380px;
      max-height: 560px;
      overflow-y: auto;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa;
      color: #1a1a1a;
    }
    header {
      padding: 14px 16px 10px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
    }
    header h1 {
      font-size: 15px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    header .updated {
      font-size: 11px;
      color: #888;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      font-size: 12px;
    }
    .controls select {
      padding: 5px 8px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      background: #fff;
      color: #1a1a1a;
      font: inherit;
    }
    .summary {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      border-radius: 8px;
      background: #f2f3f5;
    }
    .stat .num {
      font-size: 16px;
      font-weight: 700;
    }
    .stat .label {
      font-size: 10px;
      color: #777;
      margin-top: 2px;
    }
    ul.rows {
      list-style: none;
      margin: 0;
      padding: 8px;
    }
    li.row {
      background: #fff;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .row-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .subject {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
    }
    .code {
      font-size: 10px;
      color: #999;
    }
    .pct {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }
    .pct.low { color: #d92d20; }
    .pct.mid { color: #b54708; }
    .pct.ok  { color: #067647; }
    .row-bottom {
      margin-top: 4px;
      font-size: 11px;
      color: #666;
    }
    .bar-track {
      margin-top: 6px;
      height: 5px;
      border-radius: 3px;
      background: #eee;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }
    .empty {
      padding: 40px 16px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
 <title>Civvy ERP — Attendance</title>
</head>
<body>
  <header>
    <div class="brand">
      <img src="images/128x128.png" alt="ERP SYNC logo">
      <h1>ERP SYNC — Attendance</h1>
    </div>

     <div class="controls">
      <label for="criteria">Show below</label>
      <select id="criteria">
      <option value="50%">50%</option>
        <option value="75%" selected>75%</option>
        <option value="80%">80%</option>
        <option value="85%">85%</option>
      </select>
    </div>
    <div class="updated" id="updated"></div>
  </header>
  <div class="summary" id="summary"></div>
  <ul class="rows" id="rows"></ul>
  <hr>
  <p>-By Krishna Sapkota</p>
  <hr>
  <script src="popup.js"></script>
</body>
</html>
